[package]
name = "latinga"
version = "0.2.0"
edition = "2024"
description = "High-performance, Zero-Copy Uzbek Cyrillic-Latin transliterator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tilsevarlar-gurungu/latinga"
keywords = ["uzbek", "transliteration", "cyrillic", "latin", "uzbekistan"]
categories = ["text-processing"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "latinga"
required-features = ["cli"]

[dependencies]
regex = { version = "1.13", default-features = false, features = [
    "std",
    "perf",
    "unicode-perl",
    "unicode-case",
] }
anyhow = "1.0"
aho-corasick = "1.1"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
memmap2 = "0.9"

# --- Optional Dependencies ---
clap = { version = "4.6", features = ["derive"], optional = true }
glob = { version = "0.3", optional = true }
tempfile = { version = "3.27", optional = true }
rayon = { version = "1.12", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = ["cli"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]
cli = ["clap", "glob", "tempfile", "rayon"]

# --- Dev Dependencies (Platform Gated) ---

# 1. Native-only dev-dependencies (CLI tests & Benchmarks)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"  # Moved here!
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
glob = "0.3"

# 2. WASM-only dev-dependencies
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[bench]]
name = "benchmark"
harness = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
